name: DevSecOps Pipeline

on:
  push:
    branches: ["main"]
    
jobs:
  security-scan
  
    runs-on: ubuntu-latest
    
    steps:
    
    -name: Checkout
     uses: actions/checkout@v3
     
    -name: Build Docker Image
     run: docker build -t devsecops-calculator
     
     
    -name: Install Trivy
     run: |
       sudo apt-get update
       sudo apt-get install wget -y
       wget https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.48.3_Linux-64bit.deb
       sudo dpkg -i trivy_0.48.3_Linux-64bit.deb
       
     -name: Run Trivy Scan
      run: trivy image devsecops-calculator

